name: OmniFlow CI
on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Verify full application baseline is present
        run: |
          test -f omniflow/engine.py
          test -f omniflow/studio.py
          test -f omniflow/visual.py
          test -f swordx/workflows.py
          test -d tests
          test -d tests_omni
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run old and new regression suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests tests_omni
      - name: Compile all code
        run: python -m compileall -q omniflow swordx
